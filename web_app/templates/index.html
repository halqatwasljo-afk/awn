<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عون - رفيقك الشخصي</title>
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <div class="lock-icon">🔐</div>
            <h1>عون - رفيقك الشخصي</h1>
            <p>أدخل الكود السري للوصول</p>
            <input type="password" id="pin-input" placeholder="أدخل الكود السري هنا..." />
            <button onclick="login()">دخول 🚀</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <!-- القائمة الجانبية -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <h3>📚 ما أعرفه عنك</h3>
                <button id="close-sidebar" onclick="toggleSidebar()">✖</button>
            </div>
            <div class="sidebar-content">
                <details>
                    <summary>💊 الأدوية المستخدمة</summary>
                    <ul id="list-meds"><li>جاري التحميل...</li></ul>
                </details>
                <details>
                    <summary>👤 معلومات شخصية</summary>
                    <ul id="list-personal"><li>جاري التحميل...</li></ul>
                </details>
                <details>
                    <summary>📝 معلومات أخرى</summary>
                    <ul id="list-other"><li>جاري التحميل...</li></ul>
                </details>
            </div>
        </aside>

        <!-- طبقة معتمة للموبايل عند فتح القائمة -->
        <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <div id="main-content">
            <header>
                <div class="header-right">
                    <button id="menu-btn" onclick="toggleSidebar()">☰</button>
                    <h2>🤝 عون - رفيقك الشخصي</h2>
                </div>
                <div class="header-controls">
                    <select id="voice-select">
                        <option value="ar-JO-TaimNeural">عون (أردني)</option>
                        <option value="ar-SY-LaithNeural">ليث (سوري)</option>
                        <option value="ar-SY-AmanyNeural">أماني (سورية)</option>
                        <option value="ar-LB-RamiNeural">رامي (لبناني)</option>
                    </select>
                    <label class="mute-toggle">
                        <input type="checkbox" id="mute-audio"> 🔇 كتم الصوت
                    </label>
                    <button id="clear-btn" onclick="clearChat()">🗑️ مسح</button>
                </div>
            </header>

            <main id="chat-container"></main>

            <footer>
                <div class="input-area">
                    <button id="mic-btn" onclick="toggleRecording()">🎤</button>
                    <textarea id="msg-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                    <button id="send-btn" onclick="sendMessage()">إرسال ➤</button>
                </div>
                <p id="status" class="status"></p>
            </footer>
        </div>
    </div>

    <audio id="player" style="display: none;"></audio>
    <script src="/static/app.js"></script>
</body>
</html>
